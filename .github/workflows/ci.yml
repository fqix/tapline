name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Lets release.yml reuse the build so published VSIX files come from the same pipeline.
  workflow_call:
    inputs:
      package:
        description: Package and upload the VSIX files (release only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `e2e` runs the extension in a real VS Code; one runner per OS where the
          # built core matches the runner's architecture.
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-latest
            target: darwin-arm64
            e2e: true
          - runner: ubuntu-latest
            target: linux-x64
            e2e: true
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: win32-x64
            e2e: true
          # GitHub-hosted Windows ARM runners are not available; Go cross-compiles
          # the arm64 package on the x64 runner.
          - runner: windows-latest
            target: win32-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Read pinned Go version
        id: go
        run: node -e "const fs=require('fs'), p=require('./third_party/patches/sing-box/pin.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + p.toolchain.slice(2).split('.').slice(0,2).join('.') + String.fromCharCode(10))"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          # The Go module is fetched by core:build; pin + patches define its dependencies.
          cache-dependency-path: |
            third_party/patches/sing-box/pin.json
            third_party/patches/sing-box/**
            engine/go.sum

      - name: Install dependencies
        # Install strictly from the committed lockfile: regenerating it here would
        # re-resolve semver ranges on every run, so a newly published version could
        # reach the VSIX that release.yml publishes. The lockfile already carries
        # every @esbuild platform package, so `npm ci` needs no help.
        # curlconverter's native tree-sitter addons do not support every Node 24
        # target. Build and tests use our WASM parser instead; only esbuild needs
        # its install script for this pipeline (VSIX packaging does not sign).
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild esbuild

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Build patched core
        run: npm run core:build -- --target ${{ matrix.target }}

      - name: Test and vet patched Go packages (race detector enabled)
        run: npm run core:test

      - name: Build extension
        run: npm run build

      - name: Run unit and integration tests
        run: npm test

      - name: Run end-to-end tests (VS Code)
        if: matrix.e2e && runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Run end-to-end tests (VS Code)
        if: matrix.e2e && runner.os != 'Linux'
        run: npm run test:e2e

      # Only release.yml consumes the VSIX artifacts; push and PR runs skip them.
      - name: Package VSIX
        if: inputs.package
        run: npm run package -- --target ${{ matrix.target }}

      - name: Upload VSIX
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: tapline-${{ matrix.target }}
          path: tapline-${{ matrix.target }}-*.vsix
          if-no-files-found: error
          retention-days: 14
