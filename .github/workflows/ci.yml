name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-latest
            target: darwin-arm64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: win32-x64
          # GitHub-hosted Windows ARM runners are not available; Go cross-compiles
          # the arm64 package on the x64 runner.
          - runner: windows-latest
            target: win32-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Read pinned Go version
        id: go
        run: node -e "const fs=require('fs'), p=require('./third_party/patches/sing-box/pin.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + p.toolchain.slice(2).split('.').slice(0,2).join('.') + String.fromCharCode(10))"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          # The Go module is fetched by core:build; pin + patches define its dependencies.
          cache-dependency-path: |
            third_party/patches/sing-box/pin.json
            third_party/patches/sing-box/**

      - name: Install dependencies
        # Keep the lockfile usable when npm's bundled resolver updates optional
        # platform packages (esbuild publishes one package per runner platform).
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Build patched core
        run: npm run core:build -- --target ${{ matrix.target }}

      - name: Test and vet patched Go packages (race detector enabled)
        run: npm run core:test

      - name: Build extension
        run: npm run build

      - name: Run unit and integration tests
        run: npm test

      - name: Package VSIX
        run: npm run package -- --target ${{ matrix.target }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: tapline-${{ matrix.target }}
          path: tapline-${{ matrix.target }}-*.vsix
          if-no-files-found: error
          retention-days: 14
